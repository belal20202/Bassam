name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Bassam Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Signing & Environment
        run: |
          # 1. If debug.keystore does not exist, decode from base64
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi
          # 2. If still missing or empty, generate a debug.keystore with keytool
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Verify debug.keystore exists and show details
          ls -la debug.keystore
          # Ensure .env exists for Secrets Gradle Plugin
          touch .env
          # Ensure gradlew executable
          chmod +x gradlew

      - name: Sync Game Assets to Android
        run: |
          mkdir -p app/src/main/assets
          cp -f index.html style.css manifest.json *.js app/src/main/assets/ 2>/dev/null || true
          ls -la app/src/main/assets

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Bassam-Runner.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bassam-Runner-APK
          path: release-output/Bassam-Runner.apk
          retention-days: 30
