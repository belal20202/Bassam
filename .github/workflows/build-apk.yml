name: Build Bassam Runner Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Bassam APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI & Core
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor for Android
        run: |
          npx cap init "Bassam Runner" "com.bilalalnuaimi.bassam" --web-dir dist
          npx cap add android

      - name: Sync Web Build to Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and Rename APK
        run: |
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} Bassam-Runner-v2.0-debug.apk \;
          ls -la Bassam-Runner-v2.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bassam-Runner-Android-APK
          path: Bassam-Runner-v2.0-debug.apk
          retention-days: 30
