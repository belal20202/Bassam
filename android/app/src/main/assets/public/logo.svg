<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 280" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Speed Wing Gradient -->
    <linearGradient id="wingGradLeft" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wingGradRight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Dark Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <ellipse cx="256" cy="140" rx="240" ry="120" fill="url(#glowGrad)"/>

  <!-- Athletic Speed Chevrons Left -->
  <path d="M 120,110 L 40,85 L 75,130 L 135,130 Z" fill="url(#wingGradLeft)"/>
  <path d="M 140,140 L 25,120 L 60,165 L 155,160 Z" fill="url(#wingGradLeft)" opacity="0.75"/>
  <path d="M 160,170 L 65,160 L 90,195 L 175,190 Z" fill="url(#wingGradLeft)" opacity="0.5"/>

  <!-- Athletic Speed Chevrons Right -->
  <path d="M 392,110 L 472,85 L 437,130 L 377,130 Z" fill="url(#wingGradRight)"/>
  <path d="M 372,140 L 487,120 L 452,165 L 357,160 Z" fill="url(#wingGradRight)" opacity="0.75"/>
  <path d="M 352,170 L 447,160 L 422,195 L 337,190 Z" fill="url(#wingGradRight)" opacity="0.5"/>

  <!-- Central Crest Backing Plaque -->
  <polygon points="176,38 336,38 368,140 256,236 144,140" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="3" filter="url(#shadowGlow)"/>
  
  <!-- Inner Golden Crest Line -->
  <polygon points="184,48 328,48 354,136 256,220 158,136" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Dynamic Running Stars -->
  <circle cx="256" cy="62" r="6" fill="#fef08a"/>
  <polygon points="256,54 258,60 264,62 258,64 256,70 254,64 248,62 254,60" fill="#ffffff"/>
  <circle cx="232" cy="66" r="3.5" fill="#f59e0b"/>
  <circle cx="280" cy="66" r="3.5" fill="#f59e0b"/>

  <!-- Main Arabic Typography: بَـسّـام -->
  <text x="256" y="152" 
        text-anchor="middle" 
        font-family="'Cairo', 'Changa', sans-serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="2"
        fill="url(#goldMetallic)"
        stroke="#78350f"
        stroke-width="2.5"
        filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))">
    بَسَّام
  </text>

  <!-- Speed Dash lines beneath name -->
  <line x1="180" y1="172" x2="332" y2="172" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="178" x2="307" y2="178" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtitle: BASSAM RUNNER -->
  <text x="256" y="202" 
        text-anchor="middle" 
        font-family="system-ui, sans-serif" 
        font-size="14" 
        font-weight="800" 
        letter-spacing="5"
        fill="#f8fafc">
    BASSAM RUNNER
  </text>
</svg>
