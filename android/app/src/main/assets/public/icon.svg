<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Elegant Golden Outer Rim -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.85"/>
  <rect x="32" y="32" width="448" height="448" rx="86" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="2"/>

  <!-- Subtle Dynamic Athletic Wings -->
  <path d="M 120 220 L 256 160 L 392 220 L 360 240 L 256 195 L 152 240 Z" fill="url(#gold)" opacity="0.35"/>
  <path d="M 140 255 L 256 205 L 372 255 L 350 270 L 256 230 L 162 270 Z" fill="url(#gold)" opacity="0.2"/>

  <!-- Main Word: Bassam ONLY -->
  <text 
    x="256" 
    y="320" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Cairo', sans-serif" 
    font-size="94" 
    font-weight="900" 
    letter-spacing="2"
    fill="url(#textGrad)" 
    text-anchor="middle" 
    filter="url(#glow)">Bassam</text>
</svg>
