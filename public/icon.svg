<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="flag-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.75"/>
  <!-- Iraqi Flag Tri-Color Bar -->
  <rect x="136" y="80" width="240" height="12" fill="#dc2626" rx="6"/>
  <rect x="136" y="96" width="240" height="12" fill="#ffffff" rx="6"/>
  <rect x="136" y="112" width="240" height="12" fill="#000000" rx="6"/>
  <!-- Runner Emblem -->
  <path d="M256 160 C274 160 288 174 288 192 C288 210 274 224 256 224 C238 224 224 210 224 192 C224 174 238 160 256 160 Z" fill="url(#gold)"/>
  <!-- Dynamic Calligraphy "بسام" -->
  <text x="256" y="330" font-family="'Cairo', sans-serif" font-size="88" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 4px 16px rgba(245,158,11,0.6))">بسام</text>
  <text x="256" y="380" font-family="'Cairo', sans-serif" font-size="24" font-weight="700" fill="#fbbf24" text-anchor="middle">عداء بغداد • الإصدار 1.3</text>
  <text x="256" y="420" font-family="'Cairo', sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle">تصميم وتطوير بلال النعيمي • صنع في العراق</text>
</svg>
